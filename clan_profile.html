<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clan Profile - RADIndex</title>
    <link rel="stylesheet" href="clan_profile.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="home.html" class="logo">RADIndex</a>
      <div class="search-container">
        <input
          type="text"
          placeholder="Search for a clan..."
          class="search-input"
        />
      </div>
    </nav>

    <main class="container">
      <!-- Clan Header Section -->
      <div class="player-header">
        <div class="player-header-top">
          <img src="" alt="Clan Banner" class="player-emblem" id="clanBanner" />
        </div>
        <div class="player-header-bottom">
          <div class="player-name-clan">
            <h1 class="player-name" id="clanName">Clan Name</h1>
            <span class="clan-name" id="clanMotto">Clan Motto</span>
          </div>
          <div class="player-ranks">
            <div class="rank-bubble" id="clearsRankBubble">
              <div class="rank-bubble-label" id="clearsRankLabel">Clears Rank</div>
              <div class="rank-bubble-value" id="clearsRankCount">0</div>
            </div>
            <div class="rank-bubble" id="speedRankBubble">
              <div class="rank-bubble-label" id="speedRankLabel">Speed Rank</div>
              <div class="rank-bubble-value" id="speedRankTime">0h 0m</div>
            </div>
            <div class="rank-bubble" id="sherpaRankBubble">
              <div class="rank-bubble-label" id="sherpaRankLabel">Sherpa Rank</div>
              <div class="rank-bubble-value" id="sherpaRankCount">0</div>
            </div>
            <div class="rank-bubble" id="radTimeRankBubble">
              <div class="rank-bubble-label" id="radTimeRankLabel">Time in RADs</div>
              <div class="rank-bubble-value" id="radTimeValue">0h</div>
            </div>
            <div class="rank-bubble" id="dateFoundedBubble">
              <div class="rank-bubble-label" id="dateFoundedLabel">Founded</div>
              <div class="rank-bubble-value" id="dateFoundedValue">Date</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Clan Members Section -->
      <div class="clan-members-section" id="clanMembersSection">
        <div class="clan-members-header">
          <div class="clan-members-title-group">
            <div class="clan-members-toggle" id="clanMembersToggle">▼</div>
            <h2 class="clan-members-title">Clan Members</h2>
          </div>
          <div class="clan-members-sort">
            <select id="memberSortSelect" class="member-sort-select">
              <option value="fullClears">Full Clears</option>
              <option value="overallSpeed">Overall Speed</option>
              <option value="sherpas">Sherpas</option>
              <option value="radTime">RAD Time</option>
              <option value="joinDate">Join Date</option>
            </select>
          </div>
        </div>
        <div class="clan-members-content" id="clanMembersContent">
            <!-- Members injected via JS -->
        </div>
      </div>

      <!-- Raids/Dungeons Toggle -->
      <div class="toggle-wrapper">
        <input type="checkbox" id="view-toggle" class="toggle-checkbox" />
        <label for="view-toggle" class="toggle-container">
          <span class="toggle-option">Raids</span>
          <span class="toggle-option">Dungeons</span>
          <div class="toggle-slider"></div>
        </label>
      </div>

      <!-- Activity Cards Grid -->
      <div class="card-grid" id="cardGrid">
        <!-- Cards will be generated dynamically -->
      </div>
    </main>

    <footer class="footer">
      <div class="footer-content">
        <span>RADIndex</span>
        <span class="version">v1.0</span>
      </div>
    </footer>

    <script src="clan_profile.js"></script>
  </body>
</html>
